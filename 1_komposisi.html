<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>1. Komposisi Pegawai</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',Arial,sans-serif;background:#eef2f7;padding:20px;color:#1e293b}
.dashboard{max-width:1200px;margin:0 auto}
.main-header{background:linear-gradient(135deg,#0f172a,#1e3a8a);color:#fff;padding:25px 30px;border-radius:14px;margin-bottom:25px;box-shadow:0 10px 25px rgba(0,0,0,.15)}
.main-header h1{font-size:22px;font-weight:700}
.main-header p{font-size:14px;opacity:.8;margin-top:5px}
.data-section{background:#fff;border-radius:14px;padding:25px;box-shadow:0 10px 30px rgba(0,0,0,.06)}
.kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:15px;margin-bottom:25px}
.kpi-card{background:#f8fafc;border-radius:10px;padding:15px;border-left:5px solid #3b82f6;box-shadow:0 2px 5px rgba(0,0,0,0.05)}
.kpi-card.green{border-left-color:#16a34a}.kpi-card.red{border-left-color:#dc2626}
.kpi-card.purple{border-left-color:#7c3aed}.kpi-card.orange{border-left-color:#f59e0b}
.kpi-card .label{font-size:11px;text-transform:uppercase;letter-spacing:0.5px;color:#64748b;font-weight:700;margin-bottom:5px}
.kpi-card .value{font-size:20px;font-weight:800;color:#1e293b}
.kpi-card .desc{font-size:12px;color:#64748b;margin-top:5px}
.table-container{overflow-x:auto;margin-bottom:25px;border-radius:8px;border:1px solid #e2e8f0}
table{width:100%;border-collapse:collapse;text-align:center;font-size:13px}
thead th{padding:12px 8px;font-weight:700;font-size:11px;text-transform:uppercase;color:#fff;border-right:1px solid rgba(255,255,255,.15)}
thead th:last-child{border-right:none}
.h-q,.h-b,.h-tot{background:#dc2626}.h-ssi{background:#dc2626}.h-jst{background:#2563eb}.h-glo{background:#16a34a}.h-mag{background:#d97706}
tbody td{padding:10px 8px;border-bottom:1px solid #e2e8f0;color:#334155;text-align:center}
tbody tr:nth-child(even){background:#f8fafc}
.total-cell{font-weight:800;background:#f1f5f9}
.chart-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:20px}
.chart-card{background:#fff;border:1px solid #e2e8f0;border-radius:10px;padding:15px}
.chart-card h3{font-size:13px;font-weight:700;margin-bottom:15px;color:#475569;text-align:center}
.canvas-container{position:relative;height:280px}

/* STYLE HIGHLIGHT KHUSUS NO. 1 */
.highlight-box{background:#f0f9ff;border-left:5px solid #0284c7;border-radius:8px;padding:20px;margin-top:20px;box-shadow:0 4px 10px rgba(0,0,0,.03)}
.highlight-box h4{font-size:15px;font-weight:800;margin-bottom:12px;color:#1e293b}
.highlight-content{font-size:13.5px;line-height:1.8;color:#1e293b}
.highlight-content .p-1{margin-bottom:10px;}
.highlight-content .p-2{margin-top:15px; margin-bottom:15px; padding-top:10px; border-top:1px dashed #cbd5e1;}
.highlight-content .p-3{font-weight:600;}
.highlight-content .desc-list{margin-top:5px; font-size:12.5px;}
.highlight-content .desc-list div{margin-bottom:3px;}
.mini-table{float:right; width:320px; margin-left:15px; margin-bottom:10px; border-collapse:collapse; font-size:12px;}
.mini-table th, .mini-table td{border:1px solid #cbd5e1; padding:6px 10px; text-align:center;}
.mini-table th{background:#f1f5f9; font-weight:700;}
.mini-table .bg-red{background:#dc2626; color:#fff; border-color:#dc2626;}
.mini-table .bg-blue{background:#2563eb; color:#fff; border-color:#2563eb;}
.mini-table .bg-green{background:#16a34a; color:#fff; border-color:#16a34a;}
.mini-table .row-red{background:#fee2e2; font-weight:bold;}
.clear{clear:both;}
</style>
</head>
<body>
<div class="dashboard">
    <div class="main-header">
        <h1>1. Komposisi Pegawai</h1>
        <p>Update Data: <b>01 November 2026</b> | PT. Swadharma Sarana Informatika</p>
    </div>
    <div class="data-section">
        <div id="dataContent"></div>
    </div>
</div>

<script src="data.js"></script>
<script>
function fNum(num) { return num.toLocaleString('id-ID'); }

// Data Tabel Komposisi (Update Nov: SSI 532, JST 4491, Total 5396, Diff -163)
var komposisiData = [
{q:'I', b:'Jan', ssi:454, jst:4336, glo:333, dika:60, total:5183, diff:-62},
{q:'I', b:'Feb', ssi:447, jst:4583, glo:332, dika:51, total:5413, diff:230},
{q:'I', b:'Mar', ssi:519, jst:4687, glo:332, dika:53, total:5591, diff:178},
{q:'II', b:'April', ssi:515, jst:4479, glo:332, dika:58, total:5384, diff:-207},
{q:'II', b:'Mei', ssi:514, jst:4478, glo:332, dika:47, total:5371, diff:-13},
{q:'II', b:'Juni', ssi:514, jst:4468, glo:332, dika:45, total:5359, diff:-12},
{q:'III', b:'Juli', ssi:521, jst:4460, glo:332, dika:41, total:5354, diff:-5},
{q:'III', b:'Agustus', ssi:523, jst:4509, glo:332, dika:41, total:5405, diff:51},
{q:'III', b:'September', ssi:528, jst:4574, glo:332, dika:41, total:5475, diff:70},
{q:'IV', b:'Oktober', ssi:535, jst:4651, glo:332, dika:41, total:5559, diff:84},
{q:'IV', b:'November', ssi:532, jst:4491, glo:332, dika:41, total:5396, diff:-163}
];

var tbl = '';
komposisiData.forEach(function(r, i) {
    var isNewQ = (i === 0 || komposisiData[i-1].q !== r.q);
    var rowSpan = komposisiData.filter(d => d.q === r.q).length;
    var hl = (r.b === 'November') ? 'style="background:#fffbeb;font-weight:bold;"' : '';
    tbl += '<tr ' + hl + '>';
    if(isNewQ) tbl += '<td rowspan="'+rowSpan+'" style="font-weight:bold;background:#f1f5f9;">'+r.q+'</td>';
    tbl += '<td>'+r.b+'</td><td>'+fNum(r.ssi)+'</td><td>'+fNum(r.jst)+'</td><td>'+fNum(r.glo)+'</td><td>'+fNum(r.dika)+'</td><td class="total-cell">'+fNum(r.total)+'</td><td style="color:'+(r.diff>=0?'#16a34a':'#dc2626')+'; font-weight:bold;">'+(r.diff>=0?'+':'')+fNum(r.diff)+'</td></tr>';
});

var content = `
    <div class="kpi-grid">
        <div class="kpi-card red"><div class="label">Total Pegawai Nov</div><div class="value">5.396 Orang</div><div class="desc">-163 org dari Okt</div></div>
        <div class="kpi-card red"><div class="label">Organik & PKWT (SSI)</div><div class="value">532 Orang</div><div class="desc">-3 org dari Okt</div></div>
        <div class="kpi-card purple"><div class="label">Alih Daya (JST)</div><div class="value">4.491 Orang</div><div class="desc">-160 org dari Okt</div></div>
        <div class="kpi-card orange"><div class="label">Magang (DIKA)</div><div class="value">41 Orang</div><div class="desc">Stabil</div></div>
    </div>
    <div class="table-container">
        <table>
            <thead><tr><th class="h-q">Quartal</th><th class="h-b">Bulan</th><th class="h-ssi">SSI</th><th class="h-jst">JST</th><th class="h-glo">GLO</th><th class="h-mag">DIKA</th><th class="h-tot">Total Pegawai</th><th class="h-diff">+/-</th></tr></thead>
            <tbody>${tbl}</tbody>
        </table>
    </div>
    <div class="chart-grid">
        <div class="chart-card"><h3>📈 Tren Total Pegawai</h3><div class="canvas-container"><canvas id="chartTrendPeg"></canvas></div></div>
        <div class="chart-card"><h3>🍩 Komposisi Nov 2026</h3><div class="canvas-container"><canvas id="chartDonatPeg"></canvas></div></div>
    </div>
    
    <div class="highlight-box">
        <h4>📌 Highlight :</h4>
        <div class="highlight-content">
            <table class="mini-table">
                <tr><th>Indikator</th><th class="bg-red">SSI</th><th class="bg-blue">JST</th><th class="bg-green">Total</th></tr>
                <tr><td>Pegawai masuk</td><td>0</td><td>0</td><td>0</td></tr>
                <tr><td>Pegawai keluar</td><td>3</td><td>160</td><td>163</td></tr>
                <tr class="row-red"><td>Selisih masuk-keluar</td><td>-3</td><td>-160</td><td>-163</td></tr>
            </table>
            <div class="p-1">
                Komposisi pegawai SSI dan Alih Daya Q-4 s.d <b>01 November 2026</b> mengalami penurunan sebanyak <b>-163 orang</b> menjadi <b>5.396 orang</b> dibandingkan bulan Oktober 2026.
                <div class="desc-list" style="margin-top:10px;">
                    <div style="margin-bottom: 8px;">
                        <i>- Pegawai SSI (Out)</i> &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;: <b style="color:#dc2626;">- 3 Orang</b>, (1) Org Undur diri; (1) Orang Jeda dan (1) Pensiun Dini.
                    </div>
                    <div>
                        <i>- Pegawai JST (Out)</i> &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;: <b style="color:#dc2626;">- 160 Orang</b>, terdiri dari : (142) Org Jeda; (16) Org Undur diri; dan (2) Org Tidak Diperpanjang;
                    </div>
                </div>
            </div>
            <div class="clear"></div>
            <div class="p-2">
                Berdasarkan data Komposisi Pegawai dari <b>Januari s.d November 2026</b>, terjadi penambahan total sebesar <b>+213 orang</b>. Jika dipersentasekan, pertumbuhan total pegawai dari awal tahun hingga November adalah sebesar <b>+4,11%</b>.
            </div>
            <div class="p-3">
                Catatan Tambahan : - Terjadi penurunan pada unit SSI (-3) dan JST (-160), sehingga secara total bulanan terjadi pengurangan sebesar -163 orang dibandingkan posisi akhir bulan lalu.
            </div>
        </div>
    </div>
`;
document.getElementById('dataContent').innerHTML = content;

setTimeout(() => {
    var labelsBulan = komposisiData.map(d=>d.b);
    new Chart(document.getElementById('chartTrendPeg'), { type: 'line', data: { labels: labelsBulan, datasets: [{ label: 'Total Pegawai', data: komposisiData.map(d=>d.total), borderColor: '#1e3a8a', backgroundColor: 'rgba(30,58,138,0.1)', borderWidth: 3, tension: 0.4, fill: true, pointRadius: 4 }] }, options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } } } });
    
    // Donat data Nov: SSI 532, JST 4491, GLO 332, DIKA 41
    new Chart(document.getElementById('chartDonatPeg'), { type: 'doughnut', data: { labels: ['SSI', 'JST', 'GLO', 'DIKA'], datasets: [{ data: [532, 4491, 332, 41], backgroundColor: ['#dc2626', '#2563eb', '#16a34a', '#d97706'], borderWidth: 4, borderColor: '#fff' }] }, options: { responsive: true, maintainAspectRatio: false, cutout: '60%', plugins: { legend: { position: 'bottom' } } } });
}, 100);
</script>
</body>
</html>
